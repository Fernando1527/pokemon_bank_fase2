<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Bank | Cajero Web</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/validate.js/0.13.1/validate.min.js"></script>
</head>

<body>
<nav class="navbar navbar-expand-lg bank-navbar">
    <div class="container">
        <span class="navbar-brand">Pokémon Bank</span>
    </div>
</nav>

<main class="container main-container">

    <section id="loginView" class="login-wrapper">
        <div class="card bank-card login-card">
            <h3>Acceso al Cajero</h3>
            <p class="text-muted">Ingrese su PIN de 4 dígitos para continuar.</p>

            <input type="password" id="pinInput" class="form-control text-center mb-3" maxlength="4" placeholder="****">
            <button class="btn bank-primary btn-block" onclick="login()">Ingresar</button>
        </div>
    </section>

    <section id="atmView" class="d-none">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card bank-card p-4">
                    <h5>Información de cuenta</h5>
                    <hr>
                    <p><strong>Cliente:</strong> <span id="clientName"></span></p>
                    <p><strong>Cuenta:</strong> <span id="accountNumber"></span></p>
                    <p class="text-muted mb-1">Saldo disponible</p>
                    <h2 id="balanceText">$0.00</h2>

                    <button class="btn bank-secondary btn-block mt-4" onclick="logout()">Cerrar sesión</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card bank-card p-4 mb-4">
                    <h5>Operaciones disponibles</h5>
                    <div class="row mt-3">
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="deposit()">Depositar</button></div>
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="withdraw()">Retirar</button></div>
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="payService()">Pagar servicio</button></div>
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="showBalance()">Consultar saldo</button></div>
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="generateLastReceiptPDF()">Comprobante PDF</button></div>
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="generateHistoryPDF()">Historial PDF</button></div>
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="showChart()">Gráfico</button></div>
                        <div class="col-md-3 col-6 mb-3"><button class="atm-btn" onclick="clearData()">Reiniciar datos</button></div>
                    </div>
                </div>

                <div class="card bank-card p-4 mb-4">
                    <h5>Historial de transacciones</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered mt-3">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th>Detalle</th>
                                    <th>Monto</th>
                                </tr>
                            </thead>
                            <tbody id="historyTable"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card bank-card p-4 mb-4">
                    <h5>Gráfico de transacciones por tipo</h5>
                    <canvas id="chartCanvas"></canvas>
                </div>
            </div>
        </div>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
